[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-image-resizer"
version = "0.2.0"
description = "Generic Lambda@Edge origin-request image resizer/format-converter for CloudFront + S3, backed by Pillow."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Kalim" }]
dependencies = [
    "boto3>=1.34",
    "Pillow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3]>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[s3]>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["package", "function.zip"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
