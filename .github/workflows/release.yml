name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          INIT=$(python -c "import lambda_image_resizer; print(lambda_image_resizer.__version__)")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$INIT" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml ($PKG) / __version__ ($INIT)"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'EOF'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\] - (?P<date>.+?)$\n(?P<body>.*?)(?=^## \[|\Z)",
              text,
              re.M | re.S,
          )
          if not match:
              sys.exit(f"::error::No '## [{version}]' section in CHANGELOG.md")
          if "unreleased" in match["date"].lower():
              sys.exit(f"::error::CHANGELOG.md section for {version} is still marked Unreleased")
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(match["body"].strip() + "\n")
          EOF

      - name: Lint and type check
        run: |
          ruff check .
          ruff format --check .
          mypy src/

      - name: Test before packaging
        run: pytest

      - name: Build deployment package
        run: ./scripts/build.sh

      - name: Checksum
        run: sha256sum function.zip > function.zip.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            function.zip
            function.zip.sha256
